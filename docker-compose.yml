version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ai-code-detector-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-code-detector

  server:
    build: ./server
    container_name: ai-code-detector-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai-code-detector
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_please}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000

  client:
    build: ./client
    container_name: ai-code-detector-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    environment:
      REACT_APP_API_URL: http://localhost:5000/api

volumes:
  mongo_data:
